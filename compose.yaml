services:
  backend:
    image: ${SUBSCRIBEMANAGE_BACKEND_IMAGE:-ghcr.io/stevennight/subscribemanage-backend}:${SUBSCRIBEMANAGE_VERSION:?SUBSCRIBEMANAGE_VERSION is required}
    ports:
      - "${SUBSCRIBEMANAGE_BACKEND_BIND_ADDRESS:-127.0.0.1}:${SUBSCRIBEMANAGE_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    image: ${SUBSCRIBEMANAGE_FRONTEND_IMAGE:-ghcr.io/stevennight/subscribemanage-frontend}:${SUBSCRIBEMANAGE_VERSION:?SUBSCRIBEMANAGE_VERSION is required}
    ports:
      - "${SUBSCRIBEMANAGE_BIND_ADDRESS:-127.0.0.1}:${SUBSCRIBEMANAGE_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
